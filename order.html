<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="order.css">

    <title>Place Your Order</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    
</head>

<body>

<div class="order-page">

    <div class="order-box">

        

        <div class="cake-image">
            <img src="assets/birthday.jpg">
        </div>
     
        <div class="order-form">

            <h1>Place Your Order 🎂</h1>

            <p>
                Fill in your details and we'll prepare
                your delicious cake with love.
            </p>


            <form>

                <div class="input-box">
                    <label>Your Name</label>
                    <input type="text"
                           placeholder="Enter your name"
                           required>
                </div>


                <div class="input-box">
                    <label>Mobile Number</label>
                    <input type="tel"
                           placeholder="Enter mobile number"
                           required>
                </div>


                <div class="input-box">
                    <label>Select Cake</label>

                    <select required>

                        <option value="">
                            Select your cake
                        </option>

                        <option>
                            Chocolate Truffle Cake
                        </option>

                        <option>
                            Strawberry Cake
                        </option>

                        <option>
                            Red Velvet Cake
                        </option>

                        <option>
                            Black Forest Cake
                        </option>

                        <option>
                            Butterscotch Cake
                        </option>

                        <option>
                            Birthday Special Cake
                        </option>

                    </select>

                </div>


                <div class="input-box">
                    <label>Quantity</label>

                    <input type="number"
                           min="1"
                           value="1"
                           required>
                </div>


                <div class="input-box">
                    <label>Delivery Address</label>

                    <textarea
                        placeholder="Enter your delivery address"
                        required></textarea>
                </div>


                <button type="submit" class="place-order">

                   

                    Place Order

                </button>

            </form>


            <a href="products.html" class="back">
                ← Back to Products
            </a>

        </div>

    </div>

</div>

</body>
</html>
